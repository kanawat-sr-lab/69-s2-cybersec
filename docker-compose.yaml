services:
  db:
    image: postgres:16-alpine
    container_name: 69-s2-db
    ports:
      - 54321:5432
    environment:
      - POSTGRES_PASSWORD=12345678
      - POSTGRES_USER=kanawat
      - POSTGRES_DB=kanawat

  admin:
   image: dpage/pgadmin4:latest
   container_name: 69-s2-admin
   ports:
      - 8082:80
   environment:
      - PGADMIN_DEFAULT_EMAIL=kanawat-sr@rmutp.ac.th
      - PGADMIN_DEFAULT_PASSWORD=12345678

  
  app:
   image: prawee/strapi
   container_name: 69-s2-app
   ports:
      - 9092:1337
   environment:
      - DATABASE_CLIENT=postgres
      - DATABASE_NAME=kanawat
      - DATABASE_HOST=db
      - DATABASE_PORT=5432
      - DATABASE_USERNAME=kanawat
      - DATABASE_PASSWORD=12345678
